[package]
name = "confine"
description = "Fail-closed self-confinement for statically linked Linux helpers: Landlock, seccomp, process layers, self-checks and a denial-matrix harness, driven by a policy given as data"
version = "0.2.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "=0.4.7"
seccompiler = "=0.5.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
